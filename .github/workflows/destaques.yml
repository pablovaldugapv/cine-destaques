name: Destaques do TMDB

on:
  schedule:
    - cron: '0 9 * * 1,4'   # segunda e quinta, 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar lista
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python build.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add destaques.tsv
          git diff --cached --quiet || git commit -m "Atualiza destaques"
          git push
